name: Run tests

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Optional pytest selector to run only the selected tests"
        required: false
        default: ""

env:
  PIP_INDEX_URL: https://:2022-11-15T14:37:53.675556Z@time-machines-pypi.sealsecurity.io/

jobs:
  run-test:
    name: ${{ matrix.python-version }}-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      # run this job using this matrix
      matrix:
        os:
          # ubuntu-24.04 (ubuntu-latest) has no prebuilt CPython 3.7-3.9 for setup-python
          - "ubuntu-22.04"
          - "windows-latest"
          - "macos-latest"
        python-version:
          - "3.7"
          - "3.8"
          - "3.9"
          - "3.10"

        exclude:
          # beaker raises warning on 3.10. only windows seems affected
          # See https://github.com/bbangert/beaker/pull/213
          - os: "windows-latest"
            python-version: "3.10"
          # no arm64 CPython 3.7 exists for macos-latest; run 3.7 on the x64 macos-15-intel runner instead
          - os: "macos-latest"
            python-version: "3.7"

        include:
          - os: "macos-15-intel"
            python-version: "3.7"

      fail-fast: false

    # steps to run in each job. Some are github actions, others run shell commands
    steps:
      - name: Checkout repo
        uses: actions/checkout@v2

      - name: Set up python
        uses: MatteoH2O1999/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.architecture }}
          cache-build: true
          allow-build: allow

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade tox "setuptools<=65.5.1"
          pip list

      - name: Run tests
        run: tox -- -rfsxX ${{ inputs.test-filter }}

  build-dist:
    name: build sdist and wheel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip
          pip install build
          echo "wheel==0.38.4" > "$RUNNER_TEMP/constraints.txt"
          PIP_CONSTRAINT="$RUNNER_TEMP/constraints.txt" python -m build -C--global-option=egg_info -C--global-option=--tag-build=
          ls -l dist

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
